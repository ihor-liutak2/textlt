
name: Docker

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: textlt:demo
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image
        run: |
          docker run --rm textlt:demo --startup-check
          docker run --rm --entrypoint sh textlt:demo -ec '
            test "$(id -u)" -ne 0
            test "$(pwd)" = /work
            test -w /state
            test -x /usr/local/share/textlt/piper/bin/textlt-piper-server
            test -x /usr/local/bin/textlt-convert
            jq -e ".groups[0].pages[0].items | length == 4" "$HOME/.local/share/textlt/actions.json"
            pandoc --version >/dev/null
            pdftotext -v >/dev/null 2>&1
            command -v wl-copy wl-paste xclip
            test "$LANG" = C.UTF-8
            git --version
            ip -br addr
            ss -lntu
            /usr/local/share/textlt/piper/bin/piper-runtime/piper --help >/dev/null 2>&1
          '

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable Docker image
        if: github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          repo="ghcr.io/${GITHUB_REPOSITORY,,}"

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG"
            exit 1
          fi

          docker tag textlt:demo "$repo:$RELEASE_TAG"
          docker push "$repo:$RELEASE_TAG"

          latest_release=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.tag_name')

          if [[ "$RELEASE_TAG" == "$latest_release" ]]; then
            docker tag textlt:demo "$repo:latest"
            docker push "$repo:latest"
          fi
