
name: Docker

on:
  pull_request:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected stable release
        type: boolean
        default: false

  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve and validate image version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          image_tag="$(./scripts/textlt-docker-version.sh)"
          if [[ "$PUBLISH" == "true" ]]; then
            if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Publishing requires a stable version tag."
              exit 1
            fi
            if [[ "$GITHUB_REF_NAME" != "$image_tag" ]]; then
              echo "Release tag $GITHUB_REF_NAME does not match CMake version $image_tag." >&2
              exit 1
            fi

            gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
              --jq '[.draft, .prerelease] == [false, false]' |
              grep -qx true
            image_tag="$GITHUB_REF_NAME"
          fi

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: textlt:${{ steps.version.outputs.image_tag }}
          build-args: |
            TEXTLT_VERSION=${{ steps.version.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image
        env:
          LOCAL_IMAGE: textlt:${{ steps.version.outputs.image_tag }}
        run: |
          docker run --rm "$LOCAL_IMAGE" --startup-check

          docker run --rm --entrypoint sh "$LOCAL_IMAGE" -ec '
            test "$(id -u)" -ne 0
            test "$(pwd)" = /work
            test -w /state
            test -x /usr/local/share/textlt/piper/bin/textlt-piper-server
            test -x /usr/local/bin/textlt-convert
            jq -e ".groups[0].pages[0].items | length == 4" "$HOME/.local/share/textlt/actions.json"
            pandoc --version >/dev/null
            pdftotext -v >/dev/null 2>&1
            command -v wl-copy wl-paste xclip
            test "$LANG" = C.UTF-8
            git --version
            ip -br addr
            ss -lntu
            /usr/local/share/textlt/piper/bin/piper-runtime/piper --help >/dev/null 2>&1
          '

      - name: Log in to GitHub Container Registry
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable Docker image
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          release_tag="$GITHUB_REF_NAME"
          local_image="textlt:$release_tag"

          docker tag "$local_image" "$repo:$release_tag"
          docker push "$repo:$release_tag"

          latest_release=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.tag_name')

          if [[ "$release_tag" == "$latest_release" ]]; then
            docker tag "$local_image" "$repo:latest"
            docker push "$repo:latest"
          fi
