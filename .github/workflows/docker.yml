name: Docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked image to Docker Hub
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build the triggering commit
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: textlt:demo
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image
        run: |
          docker run --rm textlt:demo --startup-check
          docker run --rm --entrypoint sh textlt:demo -ec '
            test "$(id -u)" -ne 0
            test "$(pwd)" = /work
            test -w /state
            test -x /usr/local/share/textlt/piper/bin/textlt-piper-server
            test -x /usr/local/bin/textlt-convert
            jq -e ".groups[0].pages[0].items | length == 4" "$HOME/.local/share/textlt/actions.json"
            pandoc --version >/dev/null
            pdftotext -v >/dev/null 2>&1
            command -v wl-copy wl-paste xclip
            test "$LANG" = C.UTF-8
            git --version
            ip -br addr
            ss -lntu
            /usr/local/share/textlt/piper/bin/piper-runtime/piper --help >/dev/null 2>&1
          '

      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the checked image
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          repo="docker.io/${DOCKERHUB_USERNAME}/textlt"
          revision_tag="$repo:sha-$GITHUB_SHA"
          docker tag textlt:demo "$revision_tag"
          docker push "$revision_tag"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_tag="$repo:$GITHUB_REF_NAME"
            docker tag textlt:demo "$release_tag"
            docker push "$release_tag"
          fi
